<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <!-- Scene "check" (3.156s, scene-local time 0..3.156). Types the real command; the result line is the real output for this project.
         Start, length, transition and sound live in storyboard.json. -->
    <template>
      <style>
        @font-face { font-family: 'Inter'; font-weight: 500; font-style: normal; font-display: block; src: url('../assets/fonts/inter-latin-500-normal.woff2') format('woff2'); }
        @font-face { font-family: 'Inter'; font-weight: 800; font-style: normal; font-display: block; src: url('../assets/fonts/inter-latin-800-normal.woff2') format('woff2'); }
        @font-face { font-family: 'Source Serif 4'; font-weight: 400; font-style: normal; font-display: block; src: url('../assets/fonts/source-serif-4-latin-400-normal.woff2') format('woff2'); }
        @font-face { font-family: 'JetBrains Mono'; font-weight: 400; font-style: normal; font-display: block; src: url('../assets/fonts/jetbrains-mono-400.woff2') format('woff2'); }
        #check { --ground: #0E0E11; --ink: #F3F1EC; --muted: #8C8A92; --accent: #FF5B37; --panel: #17171B; --line: rgba(243,241,236,0.14); --ok: #7BD88F; position: relative; width: 100%; height: 100%; overflow: hidden;
          background: var(--ground); color: var(--ink); font-family: 'Inter', sans-serif; }

        #check-cam { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
          justify-content: center; gap: 60px; }
        #check-title { font-weight: 800; font-size: 96px; line-height: 1; letter-spacing: -0.045em; }
        #check-term { width: 1160px; border-radius: 30px; background: #0A0A0C; border: 1px solid var(--line);
          height: 296px; padding: 64px 72px; font-family: 'JetBrains Mono', monospace; font-size: 60px; line-height: 84px; }
        #check-term .p { color: var(--muted); }
        #check-out { color: var(--accent); }
        #check-res { display: inline-block; }
        #check-out b { color: var(--accent); font-weight: 400; }
        #check-caret { display: inline-block; width: 4px; height: 62px; margin-left: 4px; background: var(--ink);
          vertical-align: middle; }

      </style>
      <div id="check" data-composition-id="check" data-width="1920" data-height="1080" data-duration="3.156">

        <div id="check-cam" data-layout-allow-overflow>
          <h1 id="check-title">Checked by HyperFrames.</h1>
          <div id="check-term">
            <div><span class="p">$ </span><span id="check-cmd"></span><span id="check-caret"></span></div>
            <div id="check-out" class="clip" data-start="0.95" data-duration="2.206" data-track-index="1"><span id="check-res"><b>&#10003;</b> 0 errors, 0 warnings</span></div>
          </div>
        </div>
      </div>
      <script>
(() => {
const tl = gsap.timeline({ paused: true });
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
// Cubic-bezier as a GSAP ease function: ease: bez(0.16, 1, 0.3, 1)
function bez(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
  return (x) => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let lo = 0, hi = 1, t = x;
    for (let i = 0; i < 40; i++) { if (sx(t) < x) lo = t; else hi = t; t = (lo + hi) / 2; }
    return sy(t);
  };
}
// Damped spring as a GSAP ease (settles exactly at 1). zeta 0.72-0.85 = premium, tiny overshoot.
function spring(zeta = 0.78) {
  const w = 6.4 / Math.min(zeta, 0.999), wd = w * Math.sqrt(Math.max(1e-6, 1 - zeta * zeta));
  return (t) => {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    if (zeta >= 1) return 1 - (1 + w * t) * Math.exp(-w * t);
    return 1 - Math.exp(-zeta * w * t) * (Math.cos(wd * t) + (zeta * w / wd) * Math.sin(wd * t));
  };
}
// Clamped piecewise interpolation with an ease per segment: r(t, [0, 1, 2], [0, 100, 40], "power2.out")
function r(t, xs, ys, ease = "none") {
  const e = typeof ease === "function" ? ease : gsap.parseEase(ease);
  if (t <= xs[0]) return ys[0];
  for (let i = 0; i < xs.length - 1; i++)
    if (t <= xs[i + 1]) return ys[i] + (ys[i + 1] - ys[i]) * e((t - xs[i]) / (xs[i + 1] - xs[i]));
  return ys[ys.length - 1];
}
// Driver: fn(localSeconds) recomputes DOM from scratch on every seek inside [start, start + dur].
// ONE driver per element+property, spanning everything it does (use r() for several phases):
// two drivers on one property fight, because each sets its own value at build time.
function drive(start, dur, fn) {
  const o = { t: 0 };
  tl.fromTo(o, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: () => fn(o.t) }, start);
  fn(0);
}
// Counter that stays legible mid-move. fmt(v) returns the string to show.
function countUp(sel, from, to, start, dur, ease = "power2.out", fmt = (v) => Math.round(v).toLocaleString("en-US")) {
  const el = $(sel), e = gsap.parseEase(ease);
  drive(start, dur, (t) => { el.textContent = fmt(from + (to - from) * e(Math.min(1, t / dur))); });
}
// Zoom interpolated in log space (reads as constant camera speed). Never put CSS transform on sel.
// Several phases on one element: pass arrays, zoomLog(sel, [1, 1.05, 6], [0, 2.2, 3.1], ["none", "power2.in"])
function zoomLog(sel, from, to, start, dur, ease = "power2.inOut") {
  const el = $(sel);
  if (Array.isArray(from)) {  // multi-phase: from = scales, to = times (scene-local s), start = eases
    const S = from, T = to, E = Array.isArray(start) ? start : T.slice(1).map(() => start || "none");
    const L = S.map(Math.log), d = T[T.length - 1] - T[0];
    drive(T[0], d, (t) => {
      const x = T[0] + t; let i = 0;
      while (i < T.length - 2 && x > T[i + 1]) i++;
      const e = gsap.parseEase(E[i]), p = Math.min(1, Math.max(0, (x - T[i]) / (T[i + 1] - T[i])));
      gsap.set(el, { scale: Math.exp(L[i] + (L[i + 1] - L[i]) * e(p)) });
    });
    return;
  }
  const e = gsap.parseEase(ease);
  drive(start, dur, (t) => gsap.set(el, { scale: from * Math.pow(to / from, e(Math.min(1, t / dur))) }));
}
// Split an element's text into inline-block word or char spans at build time (deterministic).
function split(sel, by = "words") {
  const el = $(sel), text = el.textContent.trim(), out = [];
  el.textContent = "";
  const parts = by === "chars" ? Array.from(text) : text.split(/\s+/);
  parts.forEach((p, i) => {
    const s = document.createElement("span");
    s.style.display = "inline-block";
    s.style.whiteSpace = "pre";
    s.textContent = p === " " ? " " : p;
    el.appendChild(s);
    out.push(s);
    if (by !== "chars" && i < parts.length - 1) el.appendChild(document.createTextNode(" "));
  });
  return out;
}
// Seeded PRNG (mulberry32 over a string hash): same "random" layout on every render.
function rng(seed) {
  let h = 1779033703 ^ String(seed).length;
  for (const c of String(seed)) { h = Math.imul(h ^ c.charCodeAt(0), 3432918353); h = (h << 13) | (h >>> 19); }
  let a = h >>> 0;
  return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

const ID = "check", D = 3.156;

const CMD = "npx hyperframes check";
drive(0, D, (t) => {
  const n = Math.max(0, Math.min(CMD.length, Math.floor((t - 0.1) / 0.034)));
  $("#check-cmd").textContent = CMD.slice(0, n);
  $("#check-caret").style.opacity = t > 0.9 ? 0 : (t < 0.82 || Math.floor(t / 0.5) % 2 === 0 ? 1 : 0);
});
tl.fromTo("#check-term", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: spring(0.82) }, 0);
tl.fromTo("#check-title", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, 0.06);
tl.fromTo("#check-res", { x: -12, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 0.95);
// Hold motion here is a slow rise (not another push): the frame keeps travelling up 16px.
tl.fromTo("#check-cam", { y: 8 }, { y: -8, duration: D, ease: "none" }, 0);

window.__timelines["check"] = tl;
})();
      </script>
    </template>
